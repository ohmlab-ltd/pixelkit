name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r engine/requirements.txt pytest httpx
      - name: SAM3 import gate
        # The floor install must expose the classes the labelling pipeline
        # needs — catches a transformers release breaking us before users do.
        run: python -c "from transformers import Sam3Model, Sam3Processor, AutoProcessor"
      - name: Tests
        run: cd engine && python -m pytest tests/
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Versions
        run: node --version && npm --version
      - name: Install
        run: cd ui && npm ci
      - name: Build
        # tee the log so a failure can be surfaced in the run summary
        # (readable without expanding logs); PIPESTATUS keeps tee from
        # masking the build's exit code.
        run: |
          cd ui
          npm run build 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
      - name: Surface build failure in summary
        if: failure()
        run: |
          {
            echo "### ui build — last 60 lines"
            echo '```'
            tail -60 ui/build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        run: cd ui && npm test
