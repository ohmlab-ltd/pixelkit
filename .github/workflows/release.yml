name: release
# A vX.Y.Z tag builds the Windows installer and the macOS dmg, then publishes
# both on the tag's release, so a release never lacks one of them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  versions:
    # Fails unless the version stamps match the tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version stamps match tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$TAG\"" desktop/package.json \
            || { echo "desktop/package.json != $TAG"; exit 1; }
          grep -q "^PK_VERSION = \"$TAG\"" engine/gd/server.py \
            || { echo "engine PK_VERSION != $TAG"; exit 1; }
          grep -q "^version = \"$TAG\"" engine/pyproject.toml \
            || { echo "engine/pyproject.toml != $TAG"; exit 1; }

  windows:
    needs: versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI
        run: cd ui && npm ci && npm run build
      - name: Build installer (unsigned)
        shell: bash
        run: |
          exec > >(tee build.log) 2>&1
          cd desktop && npm ci
          npx electron-builder --win --publish never
      - name: Surface build failure
        # Annotations, unlike the log, can be read without signing in.
        if: failure()
        shell: bash
        run: |
          tail -n 40 build.log | tr -d '\r' | sed 's/%/%25/g' \
            | awk '{ printf "%s%%0A", $0 } END { print "" }' | sed 's/^/::error title=Last 40 lines of the build::/'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/PixelKit-Setup.exe
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: versions
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI
        run: cd ui && npm ci && npm run build
      - name: Bundle Python runtime
        run: bash desktop/scripts/prepare-runtime.sh
      - name: Build dmg (signed ad hoc)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          exec > >(tee build.log) 2>&1
          # Signing opens every file in the app at once, tens of thousands
          # with the Python runtime; macOS allows a process 256 by default.
          sudo sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=524288
          ulimit -n 524288 || ulimit -n 65536
          cd desktop && npm ci
          # Electron 43 unpacks only on demand, and the app ships its licence files.
          node node_modules/electron/install.js
          npx electron-builder --mac --publish never
      - name: Surface build failure
        if: failure()
        shell: bash
        run: |
          tail -n 40 build.log | tr -d '\r' | sed 's/%/%25/g' \
            | awk '{ printf "%s%%0A", $0 } END { print "" }' | sed 's/^/::error title=Last 40 lines of the build::/'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: desktop/dist/PixelKit-arm64.dmg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release notes from CHANGELOG.md
        # The tag's "## X.Y.Z" section, with CR stripped; empty when there is none.
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '{ sub(/\r$/, "") }
            $0 == "## " v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # Version-less names keep releases/latest/download/<name> stable.
          files: |
            dist/PixelKit-Setup.exe
            dist/PixelKit-arm64.dmg
          fail_on_unmatched_files: true
          body_path: notes.md
          generate_release_notes: true
