name: release
# A vX.Y.Z tag builds the Windows installer and the macOS dmg and attaches
# them to the tag's release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  versions:
    # Fails unless the version stamps match the tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version stamps match tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$TAG\"" desktop/package.json \
            || { echo "desktop/package.json != $TAG"; exit 1; }
          grep -q "^PK_VERSION = \"$TAG\"" engine/gd/server.py \
            || { echo "engine PK_VERSION != $TAG"; exit 1; }
          grep -q "^version = \"$TAG\"" engine/pyproject.toml \
            || { echo "engine/pyproject.toml != $TAG"; exit 1; }

  windows:
    needs: versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI
        run: cd ui && npm ci && npm run build
      - name: Build installer (unsigned)
        run: cd desktop && npm ci && npx electron-builder --win
      - name: Release notes from CHANGELOG.md
        # The tag's "## X.Y.Z" section, with CR stripped; empty when there is none.
        shell: bash
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '{ sub(/\r$/, "") }
            $0 == "## " v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          # A version-less name keeps releases/latest/download/PixelKit-Setup.exe stable.
          files: desktop/dist/PixelKit-Setup*.exe
          body_path: notes.md
          generate_release_notes: true

  macos:
    needs: versions
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI
        run: cd ui && npm ci && npm run build
      - name: Bundle Python runtime
        run: bash desktop/scripts/prepare-runtime.sh
      - name: Build dmg (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: cd desktop && npm ci && npx electron-builder --mac
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '{ sub(/\r$/, "") }
            $0 == "## " v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.dmg
          body_path: notes.md
          generate_release_notes: true
