name: Bug report
description: Something in PixelKit does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: PixelKit version
      description: Shown at the right of the status bar.
      placeholder: v0.4.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (NVIDIA GPU)
        - Windows (no NVIDIA GPU / CPU mode)
        - macOS (Apple Silicon)
        - Linux (from source)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what was expected?
      description: Steps to reproduce, if known.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Engine log
      description: |
        The last 50 lines of the engine log: Help > Open Engine Log Folder, or
        `%APPDATA%\PixelKit\logs\engine.log` on Windows and
        `~/Library/Logs/PixelKit/engine.log` on macOS. When the engine runs
        from a terminal, its output. The log can contain file paths.
      render: text
