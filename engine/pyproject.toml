[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelkit"
version = "0.1.0.dev0"
description = "Local-first dataset auto-labelling with SAM 3"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
pixelkit = "pixelkit_cli:main"

[tool.setuptools]
py-modules = ["pixelkit_cli", "import_legacy"]

[tool.setuptools.packages.find]
include = ["gd*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
