[pytest]
testpaths = tests
python_files = test_*.py
# Coverage over the application packages. The fail-under gate starts at 0
# so this scaffolding PR is green; later sessions ratchet it up as the
# exhaustive per-module suites land.
addopts =
    --cov=gd
    --cov=worker
    --cov=train-worker
    --cov-report=term-missing
    --cov-fail-under=0
filterwarnings =
    ignore::DeprecationWarning
