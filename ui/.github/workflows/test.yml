name: tests

# Lint + typecheck + unit tests for both the frontend (repo root) and the
# vendored backend (pixelkit-server/). GitHub Actions only reads workflows
# from the repo-root .github/workflows, so both suites live here as
# separate jobs while the backend is vendored in. When the backend moves
# back to its own repo, lift the `backend` job into that repo's workflow.
on:
  pull_request:
  push:
    branches: [main, ultraplan-workspace]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # `npm ci` runs the postinstall `prisma generate`, which the
      # typecheck needs for the generated client types.
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:cov
    # NB: `npm run build` is intentionally NOT run here — Next's
    # page-data collection executes route modules that need runtime env
    # (DATABASE_URL, auth secrets). Build is covered by the deploy
    # pipeline, which has those secrets.

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pixelkit-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only the lean dev deps — the GPU/ML stack from requirements.txt is
      # stubbed in tests/conftest.py, so tests run CPU-only.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
